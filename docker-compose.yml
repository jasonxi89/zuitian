services:
  rizz:
    image: jasonxi89/zuitian:latest
    pull_policy: always
    container_name: zuitian
    ports:
      - "8901:8901"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-deepseek/deepseek-v4-pro}
      - OPENROUTER_VISION_MODEL=${OPENROUTER_VISION_MODEL:-anthropic/claude-opus-4.8}
    restart: unless-stopped
