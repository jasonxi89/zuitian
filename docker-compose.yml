services:
  rizz:
    image: jasonxi89/zuitian:latest
    pull_policy: always
    container_name: zuitian
    ports:
      - "8901:8901"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-7}
    restart: unless-stopped
